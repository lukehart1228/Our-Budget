<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#172A45">
<title>Budget safety check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* Same palette (Navy and brass) and scale as the budget app. */
  :root{ --bar:#172A45; --bar-text:#F5F1E6; --brand:#E2B556; --ink:#16233A; --ink2:#525D6E; --paper:#EEF0F3; --card:#FFFFFF;
         --line:#DCE1E8; --action:#1F5F9E; --action-text:#FFFFFF; --pass:#1F5F9E; --over-ink:#A44A12; --focus:#E2B556; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background:var(--paper); color:var(--ink); font:18px/1.4 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing:antialiased; }
  .bar{ background:var(--bar); color:var(--bar-text); padding:env(safe-area-inset-top, 0px) 16px 0; }
  .bar-row{ display:flex; align-items:center; gap:12px; min-height:52px; max-width:480px; margin:0 auto; }
  .brand{ font-family:'Barlow Condensed', sans-serif; font-weight:700; letter-spacing:.14em; color:var(--brand); font-size:18px; }
  .bar-title{ font-weight:600; }
  main{ max-width:480px; margin:0 auto; padding:16px 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
  .lede{ font-size:16px; color:var(--ink2); margin:0 0 12px; }
  .card{ background:var(--card); border-radius:10px; padding:4px 16px; }
  .row{ display:flex; gap:12px; padding:12px 0; border-top:1px solid var(--line); align-items:flex-start; }
  .row:first-child{ border-top:none; }
  .tag{ font-family:'Barlow Condensed', sans-serif; font-weight:700; font-size:18px; letter-spacing:.04em; width:44px; flex-shrink:0; }
  .tag.pass{ color:var(--pass); }
  .tag.fail{ color:var(--over-ink); }
  .tag.info{ color:var(--ink2); }
  .msg{ font-size:18px; line-height:1.4; }
  .msg small{ display:block; color:var(--ink2); font-size:16px; margin-top:2px; }
  .summary{ margin:16px 0 0; font-weight:700; font-size:22px; }
  .summary.pass{ color:var(--pass); }
  .summary.fail{ color:var(--over-ink); }
  button{ margin-top:16px; width:100%; background:var(--action); color:var(--action-text); border:none; border-radius:10px; min-height:56px;
          font:700 20px 'Barlow', system-ui, -apple-system, sans-serif; cursor:pointer; }
  button:disabled{ opacity:.5; }
  button:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }
</style>
</head>
<body>
<header class="bar"><div class="bar-row"><span class="brand">BUDGET</span><span class="bar-title">Safety check</span></div></header>
<main>
  <p class="lede">Checks the shared budget the same way the app talks to it. Safe to run any time, as often as you like: it adds one test entry dated 1999 and removes it again straight away.</p>
  <div class="card" id="out" aria-live="polite"></div>
  <div class="summary" id="summary">Checking…</div>
  <button id="again" type="button" disabled>Run again</button>
</main>
<script>
const out = document.getElementById('out');
const summary = document.getElementById('summary');
const again = document.getElementById('again');

function line(kind, text, detail){
  const row = document.createElement('div');
  row.className = 'row';
  const tag = document.createElement('span');
  tag.className = 'tag ' + kind;
  tag.textContent = kind === 'pass' ? 'PASS' : kind === 'fail' ? 'FAIL' : 'Info';
  const msg = document.createElement('div');
  msg.className = 'msg';
  msg.textContent = text;
  if (detail) { const s = document.createElement('small'); s.textContent = detail; msg.appendChild(s); }
  row.appendChild(tag); row.appendChild(msg);
  out.appendChild(row);
}

// Same kind of request the app sends. Gives up after 20 seconds.
async function req(url, options){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 20000);
  try {
    const res = await fetch(url, Object.assign({ cache: 'no-store', signal: ctrl.signal }, options || {}));
    let body = null;
    try { body = await res.json(); } catch (e) {}
    return { ok: res.ok, status: res.status, body };
  } catch (e) {
    return { ok: false, status: 0, body: null };
  } finally { clearTimeout(timer); }
}
const json = (method, body) => ({ method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

async function run(){
  out.innerHTML = '';
  summary.className = 'summary';
  summary.textContent = 'Checking…';
  again.disabled = true;
  let fails = 0;
  const pass = (t, d) => line('pass', t, d);
  const fail = (t, d) => { fails++; line('fail', t, d); };

  // Which app file is live here, and which database it points at. Read from
  // index.html itself, so this page can never check the wrong database.
  let html = '';
  try { const r = await fetch('index.html', { cache: 'no-store' }); if (r.ok) html = await r.text(); } catch (e) {}
  const base = (html.match(/const FIREBASE_URL\s*=\s*"([^"]+)"/) || [])[1];
  const version = (html.match(/const PAGE_VERSION\s*=\s*'([^']+)'/) || [])[1];
  if (!base) {
    fail('Couldn\u2019t read the budget app next to this page', 'Open this page at the same address as the app, ending in /Our-Budget/check.html.');
    return finish();
  }
  line('info', version ? `The budget app here is version ${version}` : 'The budget app here is the old version (it has no version number)',
       `It uses the database at ${base.replace(/^https?:\/\//, '')}`);

  // 1. Read the list, as the app does every 15 seconds.
  const read = await req(`${base}/expenses.json`);
  if (read.ok) {
    const n = read.body && typeof read.body === 'object' ? Object.keys(read.body).length : 0;
    pass('Reading the shared budget works', `${n} ${n === 1 ? 'entry' : 'entries'} in it right now.`);
  } else {
    fail('Can\u2019t read the shared budget', read.status === 401 ? 'The database said permission denied. Put the rules back the way they were.' : 'No answer from the database. Is this phone online?');
    return finish();
  }

  // 2. Add one entry and remove it, with the same request the app uses.
  const add = await req(`${base}/expenses.json`, json('PATCH', { zz_safety_check: { amount: 0.01, category: 'zz_check', date: '1999-01-01', note: 'Safety check, removed automatically', createdAt: Date.now() } }));
  const remove = add.ok ? await req(`${base}/expenses.json`, json('PATCH', { zz_safety_check: null })) : { ok: false };
  const after = remove.ok ? await req(`${base}/expenses/zz_safety_check.json`) : { ok: false };
  if (add.ok && remove.ok && after.ok && after.body === null) {
    pass('Adding and removing an entry works', 'The test entry is already gone again.');
  } else if (!add.ok) {
    fail('Adding an entry was refused', add.status === 401 ? 'Permission denied: the rules are blocking normal entries, so the app can\u2019t save anything. Put the rules back the way they were.' : 'No answer from the database. Is this phone online?');
  } else {
    fail('The test entry couldn\u2019t be removed', 'Run this check again to clean it up. It\u2019s dated 1999, so it doesn\u2019t show in this year\u2019s numbers.');
  }

  // 3. Try to write somewhere the app never writes. The protection rules
  //    should refuse it; if they don't, take the test value straight back out.
  const outside = await req(`${base}/zz_safety_check.json`, json('PUT', true));
  if (outside.status === 401 || outside.status === 403) {
    pass('Writing outside the expense list is refused', 'The protection rules are on: nothing can wipe or replace the whole list in one go.');
  } else if (outside.ok) {
    const undo = await req(`${base}/zz_safety_check.json`, { method: 'DELETE' });
    fail('The protection rules aren\u2019t on yet', 'The database still accepts writes anywhere, so one request could wipe the whole budget.' + (undo.ok ? ' The test value was removed again.' : ' Run this check again to clean up the test value.'));
  } else {
    fail('Couldn\u2019t test the protection rules', 'No answer from the database. Is this phone online?');
  }

  finish();
  function finish(){
    summary.textContent = fails ? `${fails} ${fails === 1 ? 'check' : 'checks'} failed` : 'All checks passed';
    summary.className = 'summary ' + (fails ? 'fail' : 'pass');
    again.disabled = false;
  }
}
again.onclick = run;
run();
</script>
</body>
</html>
